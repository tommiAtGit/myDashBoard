version: '3.8'

services:
  # First: myTodoService
  myTodoService:
    image: mydashboard-todo-service
    build:
      context: ./myTodoService
      dockerfile: Dockerfile
    container_name: myTodoService
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MySqlConnectionString=Server=mysql;Database=mydb;User=root;Password=mysecretpassword;
    ports:
      - "5001:80"
    depends_on:
      - mysql
    networks:
      - mynetwork

  # Second: myFinanceService .NET API container
  myFinanceService:
    image: mydashboard-finance-service
    build:
      context: ./myFinanceService
      dockerfile: Dockerfile
    container_name: myFinanceService
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MySqlConnectionString=Server=mysql;Database=mydb;User=root;Password=mysecretpassword;
    ports:
      - "5002:80"
    depends_on:
      - mysql
    networks:
      - mynetwork

  # Third: myNotesService .NET API container
  myNotesService:
    image: mydashboard-notes-service
    build:
      context: ./myNotesService
      dockerfile: Dockerfile
    container_name: myNotesService
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MySqlConnectionString=Server=mysql;Database=mydb;User=root;Password=mysecretpassword;
    ports:
      - "5003:80"
    depends_on:
      - mysql
    networks:
      - mynetwork

  

  # MySQL container
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: mysecretpassword
      MYSQL_DATABASE: mydb
    ports:
      - "3316:3306"
    networks:
      - mynetwork
volumes:
  mysql-data:
    driver: local
    
networks:
  mynetwork:
    driver: bridge
